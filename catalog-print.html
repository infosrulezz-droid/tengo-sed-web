<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<title>Catálogo Tengo Sed — Imprimible</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
/* ── Reset ─────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif;background:#cfd4db;color:#1a1a1a}

/* ── Action bar (screen only) ──────────────────────────── */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:9999;
  background:#023E8A;
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 28px;gap:16px;
  box-shadow:0 2px 16px rgba(0,0,0,.4);
}
.topbar-title{color:#fff;font-weight:800;font-size:15px;letter-spacing:-.3px}
.topbar-sub{color:rgba(255,255,255,.6);font-size:11px;margin-top:2px}
.btn-print{
  background:#22c55e;color:#fff;border:none;border-radius:8px;
  padding:10px 26px;font-size:14px;font-weight:800;cursor:pointer;
  white-space:nowrap;transition:.15s;
  box-shadow:0 4px 16px rgba(34,197,94,.4);
}
.btn-print:hover{background:#16a34a;transform:translateY(-1px)}

/* ── Paper (screen preview) ────────────────────────────── */
.paper{
  width:21.59cm;
  margin:64px auto 48px;
  background:#fff;
  box-shadow:0 12px 60px rgba(0,0,0,.28);
}

/* ── Print page setup ──────────────────────────────────── */
@page{
  size:letter portrait;
  margin:1.2cm 1.4cm 1.8cm 1.4cm;
}

/* ── Cover ─────────────────────────────────────────────── */
.cover{
  background:linear-gradient(135deg,#023E8A 0%,#0077B6 40%,#0096C7 70%,#00B4D8 100%);
  padding:26px 36px;
  display:flex;align-items:center;gap:28px;
  position:relative;overflow:hidden;
}
.cover::before{
  content:'';position:absolute;right:-60px;top:-60px;
  width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.12),transparent 65%);
}
.cover-logo{
  height:86px;width:auto;flex-shrink:0;
  mix-blend-mode:multiply;filter:contrast(1.1) saturate(1.1);
}
.cover-center{flex:1;color:#fff}
.cover-center h1{
  font-size:26px;font-weight:900;letter-spacing:-1px;line-height:1.05;
}
.cover-gold{color:#FCD34D}
.cover-sub{
  font-size:10.5px;font-weight:700;letter-spacing:2.5px;
  text-transform:uppercase;color:rgba(255,255,255,.65);margin-top:7px;
}
.cover-right{
  color:#fff;text-align:right;flex-shrink:0;
  display:flex;flex-direction:column;gap:5px;
}
.cover-total{font-size:28px;font-weight:900;line-height:1}
.cover-total-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.6)}
.cover-date{font-size:10px;color:rgba(255,255,255,.55);margin-top:4px}
.cover-branches{
  display:flex;gap:16px;margin-top:10px;
  border-top:1px solid rgba(255,255,255,.15);
  padding-top:10px;
}
.cover-branch{font-size:9.5px;color:rgba(255,255,255,.7);display:flex;flex-direction:column;gap:2px}
.cover-branch strong{color:#fff;font-size:10.5px}

/* ── Category section ──────────────────────────────────── */
.cat-section{page-break-before:always;break-before:page}
.cat-section:first-of-type{page-break-before:avoid;break-before:avoid}

/* ── Category header bar ───────────────────────────────── */
.cat-bar{
  display:flex;align-items:center;gap:10px;
  padding:10px 18px;border-bottom:2px solid rgba(0,0,0,.07);
}
.cat-emoji{font-size:20px;line-height:1}
.cat-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
.cat-count{
  margin-left:auto;
  font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:#94a3b8;
}

/* ── Product grid ──────────────────────────────────────── */
.product-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-left:1px solid #e2e8f0;
  border-top:1px solid #e2e8f0;
}
.product-card{
  border-right:1px solid #e2e8f0;
  border-bottom:1px solid #e2e8f0;
  display:flex;flex-direction:column;
  break-inside:avoid;page-break-inside:avoid;
}
.pimg-wrap{
  width:100%;aspect-ratio:1;
  background:#f8fafc;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  border-bottom:1px solid #f0f4f8;
}
.pimg{
  max-width:100%;max-height:100%;
  object-fit:contain;
  padding:6px;
}
.no-pimg{
  font-size:30px;color:#cbd5e1;
  display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;
}
.pinfo{padding:8px 10px 10px}
.pname{
  font-size:10px;font-weight:700;color:#1e293b;
  line-height:1.3;margin-bottom:4px;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.pprice{
  font-size:13px;font-weight:900;
  color:#023E8A;
}
.pdesc{
  font-size:8.5px;color:#94a3b8;margin-top:3px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}

/* ── Document footer ───────────────────────────────────── */
.doc-footer{
  background:#1e293b;color:#64748b;
  padding:14px 28px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:9.5px;
  page-break-inside:avoid;break-inside:avoid;
}
.doc-footer-brand{
  font-size:12px;font-weight:800;color:#fff;letter-spacing:-.2px;
}
.doc-footer-branches{display:flex;gap:22px}
.doc-footer-branch{display:flex;flex-direction:column;gap:1px}
.doc-footer-branch strong{color:#e2e8f0;font-size:10px}
.doc-footer-web{color:#38bdf8;font-weight:700;font-size:10px}

/* ── Loading screen ────────────────────────────────────── */
#loading{
  position:fixed;inset:0;z-index:9998;
  background:#023E8A;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;font-size:18px;font-weight:700;
}
.spinner{
  width:44px;height:44px;
  border:4px solid rgba(255,255,255,.25);
  border-top-color:#fff;border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Print overrides ───────────────────────────────────── */
@media print{
  .topbar{display:none!important}
  #loading{display:none!important}
  body{background:none}
  .paper{margin:0;box-shadow:none;width:100%}
  .product-card{break-inside:avoid;page-break-inside:avoid}
  .cat-section{page-break-before:always;break-before:page}
  .cat-section:first-of-type{page-break-before:avoid;break-before:avoid}
}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <span id="loadingMsg">Cargando catálogo…</span>
</div>

<!-- Screen action bar -->
<div class="topbar">
  <div>
    <div class="topbar-title">🧾 Catálogo Tengo Sed — Imprimible</div>
    <div class="topbar-sub">Carta · 4 columnas · Por categorías · Con fotos</div>
  </div>
  <button class="btn-print" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
</div>

<!-- Paper -->
<div class="paper" id="paper">
  <!-- Injected by JS -->
</div>

<script>
const BASE = 'http://localhost:8000';

const CATS = {
  promos:   {label:'Promos',      emoji:'🏷️',  bg:'#fffdf0', accent:'#d97706'},
  bebidas:  {label:'Bebidas',     emoji:'🥤',  bg:'#f0f9ff', accent:'#0284c7'},
  cerveza:  {label:'Cerveza',     emoji:'🍺',  bg:'#fef9ec', accent:'#b45309'},
  whisky:   {label:'Whisky',      emoji:'🥃',  bg:'#fff7ed', accent:'#c2410c'},
  vodka:    {label:'Vodka',       emoji:'🫗',  bg:'#f0fdfa', accent:'#0d9488'},
  gin:      {label:'Gin',         emoji:'🍸',  bg:'#fdf4ff', accent:'#9333ea'},
  pisco:    {label:'Pisco',       emoji:'🌵',  bg:'#f0fdf4', accent:'#16a34a'},
  ron:      {label:'Ron',         emoji:'🧊',  bg:'#ecfdf5', accent:'#059669'},
  tequila:  {label:'Tequila',     emoji:'🥂',  bg:'#fffbeb', accent:'#f59e0b'},
  vino:     {label:'Vino',        emoji:'🍷',  bg:'#fdf2f8', accent:'#9d174d'},
  fernet:   {label:'Cócteles',    emoji:'🫙',  bg:'#fefce8', accent:'#854d0e'},
  licores:  {label:'Licores',     emoji:'🍾',  bg:'#f5f3ff', accent:'#7c3aed'},
  zero:     {label:'Sin Alcohol', emoji:'🫧',  bg:'#f8fafc', accent:'#475569'},
  confites: {label:'Confites',    emoji:'🍟',  bg:'#fff8f1', accent:'#c2410c'},
  otro:     {label:'Otros',       emoji:'🍶',  bg:'#f8fafc', accent:'#475569'},
};

function esc(s){ const d=document.createElement('div'); d.textContent=String(s||''); return d.innerHTML; }
function fmt(n){ return '$'+Number(n).toLocaleString('es-CL'); }

async function build(){
  document.getElementById('loadingMsg').textContent = 'Cargando productos…';

  const [pRes, mRes] = await Promise.all([
    fetch(BASE+'/products_inventory.json?t='+Date.now()),
    fetch(BASE+'/product_img_map.json?t='+Date.now())
  ]);
  const products = await pRes.json();
  const imgMap   = await mRes.json();

  document.getElementById('loadingMsg').textContent = 'Generando catálogo…';

  // Group by cat, preserve CATS display order
  const groups = {};
  for (const k of Object.keys(CATS)) groups[k] = [];
  for (const p of products){
    const c = p.cat || 'otro';
    if (!groups[c]) groups[c] = [];
    groups[c].push(p);
  }

  // Date
  const now = new Date();
  const dateStr = now.toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'});
  const total = products.length;

  let html = '';

  /* ── COVER ─────────────────────────────────────── */
  html += `
  <div class="cover">
    <img class="cover-logo" src="${BASE}/logo.png" alt="Tengo Sed"/>
    <div class="cover-center">
      <h1>Tu sed,<br><span class="cover-gold">Nuestro Plan.</span></h1>
      <div class="cover-sub">Catálogo de Productos · tengo‑sed.cl</div>
      <div class="cover-branches">
        <div class="cover-branch"><strong>Tengo Sed</strong><span>Genaro Gallo 2836A</span></div>
        <div class="cover-branch"><strong>Los Negros</strong><span>Genaro Gallo 2243</span></div>
        <div class="cover-branch"><strong>Red &amp; White</strong><span>18 de Sept 1578</span></div>
      </div>
    </div>
    <div class="cover-right">
      <div class="cover-total">${total}</div>
      <div class="cover-total-label">Productos</div>
      <div class="cover-date">${dateStr}</div>
    </div>
  </div>`;

  /* ── CATEGORIES ─────────────────────────────────── */
  let firstCat = true;

  for (const [key, catDef] of Object.entries(CATS)){
    const items = groups[key] || [];
    if (!items.length) continue;

    const sectionClass = firstCat ? 'cat-section' : 'cat-section';
    const breakStyle   = firstCat ? 'page-break-before:avoid;break-before:avoid' : '';
    firstCat = false;

    html += `<div class="cat-section" style="${breakStyle}">`;

    /* Category header bar */
    html += `
    <div class="cat-bar" style="background:${catDef.bg}">
      <span class="cat-emoji">${catDef.emoji}</span>
      <span class="cat-name" style="color:${catDef.accent}">${catDef.label}</span>
      <span class="cat-count">${items.length} producto${items.length!==1?'s':''}</span>
    </div>`;

    /* Product grid */
    html += `<div class="product-grid">`;
    for (const p of items){
      const imgFile = imgMap[p.name];
      const imgSrc  = imgFile ? `${BASE}/products/${imgFile}` : null;

      html += `<div class="product-card">`;
      html += `<div class="pimg-wrap">`;
      if (imgSrc){
        html += `<img class="pimg" src="${imgSrc}" alt="${esc(p.name)}" loading="eager"/>`;
      } else {
        html += `<div class="no-pimg">${catDef.emoji}</div>`;
      }
      html += `</div>`;
      html += `<div class="pinfo">
        <div class="pname">${esc(p.name)}</div>
        <div class="pprice">${fmt(p.price)}</div>
        ${p.desc ? `<div class="pdesc">${esc(p.desc)}</div>` : ''}
      </div>`;
      html += `</div>`; // .product-card
    }
    html += `</div>`; // .product-grid
    html += `</div>`; // .cat-section
  }

  /* ── FOOTER ─────────────────────────────────────── */
  html += `
  <div class="doc-footer">
    <div>
      <div class="doc-footer-brand">TENGO SED</div>
      <div class="doc-footer-web">tengo-sed.cl</div>
      <div style="margin-top:4px">Delivery a domicilio · Solo Iquique · Dom–Jue 12pm–1am · Vie–Sáb 12pm–3am</div>
    </div>
    <div class="doc-footer-branches">
      <div class="doc-footer-branch"><strong>Tengo Sed</strong><span>Genaro Gallo 2836A</span></div>
      <div class="doc-footer-branch"><strong>Los Negros</strong><span>Genaro Gallo 2243</span></div>
      <div class="doc-footer-branch"><strong>Red &amp; White</strong><span>18 de Sept 1578</span></div>
    </div>
  </div>`;

  document.getElementById('paper').innerHTML = html;
  document.getElementById('loading').style.display = 'none';
}

build().catch(err => {
  document.getElementById('loading').innerHTML =
    `<div style="text-align:center">
       <div style="font-size:48px;margin-bottom:16px">❌</div>
       <div style="font-size:18px;font-weight:700">Error al cargar</div>
       <div style="font-size:13px;opacity:.7;margin-top:8px">${err.message}</div>
       <div style="font-size:12px;opacity:.5;margin-top:16px">Asegúrate que el servidor esté corriendo en localhost:8000</div>
     </div>`;
});
</script>
</body>
</html>
