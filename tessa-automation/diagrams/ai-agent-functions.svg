<svg xmlns="http://www.w3.org/2000/svg" width="680" height="426" viewBox="0 0 680 426">
<style>
  svg { background:#ffffff; font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
  .th { font-size:13px; font-weight:600; fill:#1e293b; }
  .ts { font-size:11px; fill:#64748b; }
  .arr { stroke:#94a3b8; stroke-width:1.5; fill:none; }
  .c-gray  rect { fill:#f1f5f9; stroke:#94a3b8; }
  .c-teal  rect { fill:#ccfbf1; stroke:#14b8a6; }
  .c-purple rect{ fill:#ede9fe; stroke:#8b5cf6; }
  .c-coral rect { fill:#ffe4e6; stroke:#fb7185; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="426" fill="#ffffff"/>
<g class="c-purple"><rect x="40" y="136" width="200" height="64" rx="8"/><text class="th" x="140" y="164" text-anchor="middle">AI agent</text><text class="ts" x="140" y="184" text-anchor="middle">language tasks only</text></g>
<g class="c-purple"><rect x="330" y="40" width="300" height="52" rx="8"/><text class="th" x="350" y="63" text-anchor="start">Write store reports</text><text class="ts" x="350" y="81" text-anchor="start">turns variances into plain text</text></g>
<g class="c-purple"><rect x="330" y="108" width="300" height="52" rx="8"/><text class="th" x="350" y="131" text-anchor="start">Format command replies</text><text class="ts" x="350" y="149" text-anchor="start">query results into readable answers</text></g>
<g class="c-purple"><rect x="330" y="176" width="300" height="52" rx="8"/><text class="th" x="350" y="199" text-anchor="start">Route commands</text><text class="ts" x="350" y="217" text-anchor="start">reads /inventario, /precio, /venta</text></g>
<g class="c-purple"><rect x="330" y="244" width="300" height="52" rx="8"/><text class="th" x="350" y="267" text-anchor="start">Two-way chat</text><text class="ts" x="350" y="285" text-anchor="start">answers follow-up questions</text></g>
<line x1="240" y1="160" x2="326" y2="66" class="arr" marker-end="url(#arrow)"/>
<line x1="240" y1="164" x2="326" y2="134" class="arr" marker-end="url(#arrow)"/>
<line x1="240" y1="172" x2="326" y2="202" class="arr" marker-end="url(#arrow)"/>
<line x1="240" y1="176" x2="326" y2="270" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="330" width="590" height="56" rx="8"/><text class="th" x="60" y="356" text-anchor="start">Not the AI's job</text><text class="ts" x="60" y="374" text-anchor="start">reconciliation, counting, variance + reorder math all stay in Code nodes</text></g>
</svg>
