<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580">
<style>
  svg { background:#ffffff; font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
  .th { font-size:13px; font-weight:600; fill:#1e293b; }
  .ts { font-size:11px; fill:#64748b; }
  .arr { stroke:#94a3b8; stroke-width:1.5; fill:none; }
  .c-gray  rect { fill:#f1f5f9; stroke:#94a3b8; }
  .c-teal  rect { fill:#ccfbf1; stroke:#14b8a6; }
  .c-purple rect{ fill:#ede9fe; stroke:#8b5cf6; }
  .c-coral rect { fill:#ffe4e6; stroke:#fb7185; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="580" fill="#ffffff"/>
<g class="c-gray"><rect x="190" y="40" width="200" height="56" rx="8"/><text class="th" x="290" y="64" text-anchor="middle">Schedule trigger</text><text class="ts" x="290" y="82" text-anchor="middle">runs daily</text></g>
<g class="c-teal"><rect x="190" y="124" width="200" height="56" rx="8"/><text class="th" x="290" y="148" text-anchor="middle">Read Drive files</text><text class="ts" x="290" y="166" text-anchor="middle">stock, ventas, conteo</text></g>
<g class="c-teal"><rect x="190" y="220" width="200" height="44" rx="8"/><text class="th" x="290" y="246" text-anchor="middle">Merge by SKU</text></g>
<g class="c-teal"><rect x="190" y="304" width="200" height="56" rx="8"/><text class="th" x="290" y="328" text-anchor="middle">Calc core (Code)</text><text class="ts" x="290" y="346" text-anchor="middle">variances, reorders</text></g>
<g class="c-purple"><rect x="190" y="400" width="200" height="56" rx="8"/><text class="th" x="290" y="424" text-anchor="middle">AI agent</text><text class="ts" x="290" y="442" text-anchor="middle">writes the messages</text></g>
<g class="c-purple"><rect x="190" y="496" width="200" height="44" rx="8"/><text class="th" x="290" y="522" text-anchor="middle">Telegram per store</text></g>
<g class="c-coral"><rect x="430" y="304" width="200" height="56" rx="8"/><text class="th" x="530" y="328" text-anchor="middle">Cycle-count dispatch</text><text class="ts" x="530" y="346" text-anchor="middle">5 SKUs/store, rotating</text></g>
<line x1="290" y1="100" x2="290" y2="120" class="arr" marker-end="url(#arrow)"/>
<line x1="290" y1="184" x2="290" y2="216" class="arr" marker-end="url(#arrow)"/>
<line x1="290" y1="268" x2="290" y2="300" class="arr" marker-end="url(#arrow)"/>
<line x1="290" y1="364" x2="290" y2="396" class="arr" marker-end="url(#arrow)"/>
<line x1="290" y1="460" x2="290" y2="492" class="arr" marker-end="url(#arrow)"/>
<path d="M390 68 L530 68 L530 300" class="arr" marker-end="url(#arrow)"/>
<path d="M530 360 L530 518 L392 518" class="arr" marker-end="url(#arrow)"/>
</svg>
